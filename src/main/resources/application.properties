spring.application.name=plateforme-loisirs
# Database propreties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/loisirs?autoreconnect=true&useSSL=false&serverTimezone=Europe/Brussels&useLegacyDatetimeCode=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# jwt
app.jwt.secret=${APP_JWT_SECRET}
  # deployment
#server.address=0.0.0.0
#server.port=${PORT:8080}

# Security
# Pas d'utilisateur de secours genere : l'authentification passe par JWT (AuthService)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.forward-headers-strategy=native

# Log level configuration
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.web.resources.static-locations=classpath:/static/
logging.level.root=error
logging.level.be.loisirs=info
logging.level.org.flywaydb=info
#logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
# Flyway
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Stripe test mode : paiement et webhook
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.checkout-expiration-minutes=${STRIPE_CHECKOUT_EXPIRATION_MINUTES:31}
# Stripe pour le frontend
app.frontend-url=${APP_FRONTEND_URL:http://localhost:8080}